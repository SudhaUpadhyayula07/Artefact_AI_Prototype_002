<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Artefact.AI - Validated Multi-Format Content Transformation</title>
    <meta
      name="description"
      content="Turn one source into every communication format you select. Validated against your source facts and stamped with a verifiable SHA-256 fingerprint."
    />
    <meta name="theme-color" content="#5E60CE" />

    <!-- Favicon Set -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Artefact.AI" />
    <meta property="og:title" content="Artefact.AI - One Source In. Every Format Out." />
    <meta
      property="og:description"
      content="Give Artefact.AI an article, report, advisory or prompt. Choose the formats you need. Generated from the same fact base, checked against your source, and fingerprinted."
    />
    <meta property="og:url" content="/" id="og-url-meta" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Artefact.AI - One Source In. Every Format Out." />
    <meta
      name="twitter:description"
      content="Turn one source into LinkedIn posts, tweet threads, advisories, infographics, executive summaries, slide decks, and video scripts."
    />

    <!-- Google Fonts: Poppins ExtraBold (800), Inter (400, 500, 600), JetBrains Mono (400, 500) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Poppins:wght@700;800&display=swap"
      rel="stylesheet"
    />

    <!-- Schema.org Structured Data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Artefact.AI",
        "applicationCategory": "BusinessApplication",
        "operatingSystem": "All",
        "description": "Turn one source into every selected communication format in a single run, validated against the source and stamped with proof of origin."
      }
    </script>
  </head>
  <body class="bg-[#F8F6FF] text-[#1C192E] antialiased selection:bg-[#E0AAFF] selection:text-[#1C192E]">
